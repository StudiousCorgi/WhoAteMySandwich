<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="./css/bootstrap.css">
  <link rel="stylesheet" href="./css/styles.css">
 
  <title>Who Ate My Sandwich</title>
</head>

<body class="bg-dark text-white">

  <div class="container py-5">
    <div id="game-container" class="position-relative rounded-3 p-4">

      <!-- Suspect Carousel -->
      <div id="suspect-carousel" class="carousel slide carousel-fade mb-4" data-bs-ride="false" data-bs-wrap="false">

        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="./suspects/Suspect_Alicia.png" class="d-block w-100" alt="Suspect 1">
          </div>
          <div class="carousel-item">
            <img src="./suspects/Suspect_Matt.png" class="d-block w-100" alt="Suspect 2">
          </div>
          <div class="carousel-item">
            <img src="./suspects/Suspect_Sarah.png" class="d-block w-100" alt="Suspect 3">
          </div>
          <div class="carousel-item">
            <img src="./suspects/Suspect_Chase.png" class="d-block w-100" alt="Suspect 4">
          </div>
          <div class="carousel-item">
            <img src="./suspects/Suspect_Mike.png" class="d-block w-100" alt="Suspect 5">
          </div>
        </div>

  <button class="carousel-control-prev" type="button" data-bs-target="#suspect-carousel" data-bs-slide="prev">
    <span class="carousel-control-prev-icon"></span><span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#suspect-carousel" data-bs-slide="next">
    <span class="carousel-control-next-icon"></span><span class="visually-hidden">Next</span>
  </button>
</div>

      <!-- Question Modal -->
      <div class="modal fade" id="question-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content bg-secondary bg-opacity-75 text-white">
            <div class="modal-header border-0">
              <h5 class="modal-title" id="question-title"></h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div id="choices" class="d-grid gap-2"></div>
              <p id="response-text" class="mt-3"></p>
            </div>
            <div class="modal-footer border-0">
              <button class="btn btn-light" id="next-question-btn">Next</button>
              <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Accusation Screen -->
      <div id="accusation-screen" class="text-center d-none">
        <h2 class="mb-4">Who ate your sandwich?</h2>
        <div id="accuse-list" class="list-group mb-3"></div>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="text-center d-none">
        <p id="result-text" class="fs-4 mb-4"></p>
        <button class="btn btn-light" id="restart-btn">Play Again</button>
      </div>

      <!-- Checklist -->
      <div id="checklist" class="position-absolute bottom-0 end-0 m-3 p-3 bg-secondary bg-opacity-75 rounded-3">
        <h5>Checklist</h5>
        <div id="check-items" class="form-check"></div>
      </div>

    </div>
  </div>


  <!-- Game Logic -->
  <script src="./js/game.js"></script>
  <script src="./js/bootstrap.js"></script>
</body>

</html>
