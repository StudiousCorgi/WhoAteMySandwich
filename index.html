<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="A fun game to find out who ate your sandwich!">
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/bootstrap.css">
  <title>Who Ate My Sandwich</title>
</head>


<body class="bg-dark text-white">

  <div class="container py-5">
    <!-- Game Area -->
    <div id="game-container" class="position-relative bg-dark bg-opacity-75 rounded-3 p-4">

      <!-- Suspect Navigation -->
      <div class="d-flex justify-content-between align-items-center mb-4" id="suspect-nav">
        <button class="btn btn-outline-light" id="prev-btn">← Previous</button>
        <div class="text-center" id="suspect-card">
          <img id="suspect-img" src="./suspects/Suspect_Matt.png"
               class="rounded-circle border border-light mb-3"
               style="width: 180px; height: 180px; object-fit: cover;"
               alt="Suspect">
          <h3 id="suspect-name">Name</h3>
          <button class="btn btn-primary mt-2" id="question-btn">Ask Questions</button>
        </div>
        <button class="btn btn-outline-light" id="next-btn">Next →</button>
      </div>

      <!-- Questions -->
      <div class="modal fade" id="question-modal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content bg-secondary bg-opacity-75 text-white">
            <div class="modal-header border-0">
              <h5 class="modal-title" id="question-title"></h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div id="choices" class="d-grid gap-2"></div>
              <p id="response-text" class="mt-3"></p>
            </div>
            <div class="modal-footer border-0">
              <button class="btn btn-light" id="next-question-btn">Next Question</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Accusation Screen -->
      <div id="accusation-screen" class="text-center d-none">
        <h2 class="mb-4">Who ate your sandwich?</h2>
        <div id="accuse-list" class="list-group mb-3"></div>
        <button class="btn btn-danger" id="submit-accuse-btn">Accuse</button>
      </div>

      <!-- Result Screen -->
      <div id="result-screen" class="text-center d-none">
        <p id="result-text" class="fs-4 mb-4"></p>
        <button class="btn btn-light" id="restart-btn">Play Again</button>
      </div>

      <!-- Checklist -->
      <div id="checklist"
           class="position-absolute bottom-0 end-0 m-3 p-3 bg-secondary bg-opacity-75 rounded-3">
        <h5>Checklist</h5>
        <div class="form-check" id="check-items"></div>
      </div>

    </div>
  </div>

  <footer>
    <p>&copy; 2025 Who Ate My Sandwich. All rights reserved.</p>
    <p>Created by StudiousCorgi</p>
  </footer>
  
  <script src="./js/game.js"></script>
  <script  src="/js/bootstrap.js"></script>

</body>
</html>
